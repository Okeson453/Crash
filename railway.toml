[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Public HTTP: map to metrics/health server (default 9090).
# Set METRICS_PORT=$PORT in Railway variables so the app binds the platform port.
# /health is liveness (process up). Use /health/ready for readiness (browser/session operational).
