[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Liveness only — must stay on the process that binds $PORT (API server).
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Railway injects PORT. The app binds the API (including /health) to PORT when set.
# Do not set METRICS_PORT=$PORT unless you want metrics-only on that port.
# Optional: API_PORT overrides when PORT is unset (local/docker).
