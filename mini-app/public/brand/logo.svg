<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CrashWave">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#020617" stroke="url(#ring)" stroke-width="18"/>
  <path d="M330 150 A120 120 0 1 0 330 362" fill="none" stroke="url(#metal)" stroke-width="36" stroke-linecap="round"/>
  <rect x="230" y="280" width="28" height="70" rx="6" fill="url(#bar)"/>
  <rect x="268" y="250" width="28" height="100" rx="6" fill="url(#bar)"/>
  <rect x="306" y="210" width="28" height="140" rx="6" fill="url(#bar)"/>
  <path d="M200 320 C240 280 300 220 360 160" fill="none" stroke="url(#trail)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <g transform="translate(360,150) rotate(40)">
    <ellipse cx="0" cy="0" rx="14" ry="22" fill="#4ade80"/>
    <polygon points="-10,16 0,36 10,16" fill="#22c55e"/>
    <circle cx="0" cy="-6" r="5" fill="#dcfce7"/>
  </g>
  <text x="256" y="430" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="42" font-weight="900">
    <tspan fill="#e2e8f0">CRASH</tspan><tspan fill="#38bdf8">WAVE</tspan>
  </text>
  <text x="256" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4ade80" letter-spacing="4">CRASH GAME BOT</text>
</svg>
