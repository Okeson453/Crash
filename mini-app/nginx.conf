server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://api.crashwave.example.com wss://api.crashwave.example.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  location = /health { add_header Content-Type text/plain; return 200 'ok'; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
